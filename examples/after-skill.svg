<path d="M658.3,402 L658.3,590" fill="none" stroke="#6cb4ee" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#b)"/>
<text x="666.3" y="566" fill="#6cb4ee" font-size="15.5" text-anchor="start">preview</text>
<path d="M1190.0,402 L1190.0,590" fill="none" stroke="#6cb4ee" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#b)"/>
<text x="1198.0" y="566" fill="#6cb4ee" font-size="15.5" text-anchor="start">release entry</text>
<rect x="95.0" y="118" width="190" height="76" rx="8" fill="#1d232a" stroke="#8b96a3" stroke-width="1.5"/>
<circle cx="190" cy="143" r="11" fill="#2b8fd6"/>
<text x="190" y="147.9" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">1</text>
<text x="190" y="176.9" fill="#e6e9ec" font-size="17" text-anchor="middle">Upload file</text>
<rect x="845.0" y="118" width="190" height="76" rx="8" fill="#1d232a" stroke="#8b96a3" stroke-width="1.5"/>
<circle cx="940" cy="143" r="11" fill="#2b8fd6"/>
<text x="940" y="147.9" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">5</text>
<text x="940" y="176.9" fill="#e6e9ec" font-size="17" text-anchor="middle">Human review</text>
<rect x="345.0" y="326" width="190" height="76" rx="8" fill="#1d232a" stroke="#8b96a3" stroke-width="1.5"/>
<circle cx="440" cy="351" r="11" fill="#2b8fd6"/>
<text x="440" y="355.9" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">2</text>
<text x="440" y="384.9" fill="#e6e9ec" font-size="17" text-anchor="middle">Validate format</text>
<rect x="595.0" y="326" width="190" height="76" rx="8" fill="#1d232a" stroke="#8b96a3" stroke-width="1.5"/>
<circle cx="690" cy="351" r="11" fill="#2b8fd6"/>
<text x="690" y="355.9" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">3</text>
<text x="690" y="384.9" fill="#e6e9ec" font-size="17" text-anchor="middle">Render preview</text>
<rect x="845.0" y="326" width="190" height="76" rx="8" fill="#1d232a" stroke="#8b96a3" stroke-width="1.5"/>
<circle cx="940" cy="351" r="11" fill="#2b8fd6"/>
<text x="940" y="355.9" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">4</text>
<text x="940" y="384.9" fill="#e6e9ec" font-size="17" text-anchor="middle">Automatic checks</text>
<rect x="1095.0" y="326" width="190" height="76" rx="8" fill="#1d232a" stroke="#8b96a3" stroke-width="1.5"/>
<circle cx="1190" cy="351" r="11" fill="#2b8fd6"/>
<text x="1190" y="355.9" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">6</text>
<text x="1190" y="384.9" fill="#e6e9ec" font-size="17" text-anchor="middle">Publish</text>
<rect x="1345.0" y="326" width="190" height="76" rx="38.0" fill="#1d232a" stroke="#8b96a3" stroke-width="1.5"/>
<circle cx="1440" cy="351" r="11" fill="#2b8fd6"/>
<text x="1440" y="355.9" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">7</text>
<text x="1440" y="384.9" fill="#e6e9ec" font-size="17" text-anchor="middle">Live on site</text>
<rect x="379.2" y="590" width="340" height="62" rx="6" fill="#18202a" stroke="#6cb4ee" stroke-width="1.5"/>
<line x1="379.2" y1="598" x2="719.2" y2="598" stroke="#6cb4ee" stroke-width="1"/>
<text x="549.2" y="631.0" fill="#e6e9ec" font-size="17" text-anchor="middle">Asset store</text>
<rect x="1095.0" y="590" width="190" height="62" rx="6" fill="#18202a" stroke="#6cb4ee" stroke-width="1.5"/>
<line x1="1095.0" y1="598" x2="1285.0" y2="598" stroke="#6cb4ee" stroke-width="1"/>
<text x="1190.0" y="631.0" fill="#e6e9ec" font-size="17" text-anchor="middle">Audit log</text>
<line x1="40" y1="722" x2="70" y2="722" stroke="#c3cad2" stroke-width="2" marker-end="url(#g)"/>
<text x="80" y="727.4" fill="#8b96a3" font-size="15.5" text-anchor="start">step</text>
<line x1="140" y1="722" x2="170" y2="722" stroke="#e0a43a" stroke-width="2" marker-end="url(#a)"/>
<text x="180" y="727.4" fill="#8b96a3" font-size="15.5" text-anchor="start">send back to the author (two branches, one trunk)</text>
<circle cx="573" cy="722" r="4" fill="#e0a43a"/>
<text x="586" y="727.4" fill="#8b96a3" font-size="15.5" text-anchor="start">tee: branch joins the trunk</text>
<line x1="800" y1="722" x2="830" y2="722" stroke="#6cb4ee" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#b)"/>
<text x="840" y="727.4" fill="#8b96a3" font-size="15.5" text-anchor="start">writes to a store</text>
<circle cx="51" cy="768" r="11" fill="#2b8fd6"/>
<text x="51" y="772.9" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">1</text>
<text x="72" y="773.6" fill="#c3cad2" font-size="16" text-anchor="start">The author uploads a file.</text>
<circle cx="51" cy="802" r="11" fill="#2b8fd6"/>
<text x="51" y="806.9" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">2</text>
<text x="72" y="807.6" fill="#c3cad2" font-size="16" text-anchor="start">Validate the format; invalid files go back to the author, the original goes to the asset store.</text>
<circle cx="51" cy="836" r="11" fill="#2b8fd6"/>
<text x="51" y="840.9" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">3</text>
<text x="72" y="841.6" fill="#c3cad2" font-size="16" text-anchor="start">Render a preview and save it to the asset store.</text>
<circle cx="51" cy="870" r="11" fill="#2b8fd6"/>
<text x="51" y="874.9" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">4</text>
<text x="72" y="875.6" fill="#c3cad2" font-size="16" text-anchor="start">Automatic checks; a failure re-renders, at most 3 times.</text>
<circle cx="771" cy="768" r="11" fill="#2b8fd6"/>
<text x="771" y="772.9" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">5</text>
<text x="792" y="773.6" fill="#c3cad2" font-size="16" text-anchor="start">A human reviews; requested changes go back to the author on the same trunk as step 2.</text>
<circle cx="771" cy="802" r="11" fill="#2b8fd6"/>
<text x="771" y="806.9" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">6</text>
<text x="792" y="807.6" fill="#c3cad2" font-size="16" text-anchor="start">Publish and write a release entry to the audit log.</text>
<circle cx="771" cy="836" r="11" fill="#2b8fd6"/>
<text x="771" y="840.9" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">7</text>
<text x="792" y="841.6" fill="#c3cad2" font-size="16" text-anchor="start">The result is live on the site.</text>
</svg>