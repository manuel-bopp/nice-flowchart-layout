<text x="1290" y="358.6" fill="#e6e9ec" font-size="13" text-anchor="middle">Live on site</text>
<rect x="357.5" y="552" width="300" height="56" rx="6" fill="#18202a" stroke="#6cb4ee" stroke-width="1.5"/>
<line x1="357.5" y1="560" x2="657.5" y2="560" stroke="#6cb4ee" stroke-width="1"/>
<text x="507.5" y="588.5" fill="#e6e9ec" font-size="13" text-anchor="middle">Asset store</text>
<rect x="995.0" y="552" width="150" height="56" rx="6" fill="#18202a" stroke="#6cb4ee" stroke-width="1.5"/>
<line x1="995.0" y1="560" x2="1145.0" y2="560" stroke="#6cb4ee" stroke-width="1"/>
<text x="1070" y="588.5" fill="#e6e9ec" font-size="13" text-anchor="middle">Audit log</text>
<line x1="40" y1="674" x2="66" y2="674" stroke="#c3cad2" stroke-width="2" marker-end="url(#g)"/>
<text x="74.0" y="678.0" fill="#8b96a3" font-size="12" text-anchor="start">step</text>
<line x1="130" y1="674" x2="156" y2="674" stroke="#e0a43a" stroke-width="2" marker-end="url(#a)"/>
<text x="164.0" y="678.0" fill="#8b96a3" font-size="12" text-anchor="start">send back to the author (two branches, one trunk)</text>
<circle cx="478" cy="674" r="4" fill="#e0a43a"/>
<text x="490.0" y="678.0" fill="#8b96a3" font-size="12" text-anchor="start">tee: branch joins the trunk</text>
<line x1="680" y1="674" x2="706" y2="674" stroke="#6cb4ee" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#b)"/>
<text x="714.0" y="678.0" fill="#8b96a3" font-size="12" text-anchor="start">writes to a store</text>
<circle cx="49" cy="712" r="9" fill="#2b8fd6"/>
<text x="49" y="715.9" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">1</text>
<text x="68" y="716.4" fill="#c3cad2" font-size="12.5">The author uploads a file.</text>
<circle cx="49" cy="740" r="9" fill="#2b8fd6"/>
<text x="49" y="743.9" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">2</text>
<text x="68" y="744.4" fill="#c3cad2" font-size="12.5">Validate the format; invalid files go back to the author, the original goes to the asset store.</text>
<circle cx="49" cy="768" r="9" fill="#2b8fd6"/>
<text x="49" y="771.9" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">3</text>
<text x="68" y="772.4" fill="#c3cad2" font-size="12.5">Render a preview and save it to the asset store.</text>
<circle cx="49" cy="796" r="9" fill="#2b8fd6"/>
<text x="49" y="799.9" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">4</text>
<text x="68" y="800.4" fill="#c3cad2" font-size="12.5">Automatic checks; a failure re-renders, at most 3 times.</text>
<circle cx="729" cy="712" r="9" fill="#2b8fd6"/>
<text x="729" y="715.9" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">5</text>
<text x="748" y="716.4" fill="#c3cad2" font-size="12.5">A human reviews; requested changes go back to the author on the same trunk as step 2.</text>
<circle cx="729" cy="740" r="9" fill="#2b8fd6"/>
<text x="729" y="743.9" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">6</text>
<text x="748" y="744.4" fill="#c3cad2" font-size="12.5">Publish and write a release entry to the audit log.</text>
<circle cx="729" cy="768" r="9" fill="#2b8fd6"/>
<text x="729" y="771.9" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">7</text>
<text x="748" y="772.4" fill="#c3cad2" font-size="12.5">The result is live on the site.</text>
