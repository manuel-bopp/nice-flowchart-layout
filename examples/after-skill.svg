<text x="850" y="162.6" fill="#e6e9ec" font-size="13" text-anchor="middle">Human review</text>
<rect x="335.0" y="310" width="150" height="64" rx="8" fill="#1d232a" stroke="#8b96a3" stroke-width="1.5"/>
<circle cx="410" cy="332.5" r="9" fill="#2b8fd6"/>
<text x="410" y="336.4" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">2</text>
<text x="410" y="358.6" fill="#e6e9ec" font-size="13" text-anchor="middle">Validate format</text>
<rect x="555.0" y="310" width="150" height="64" rx="8" fill="#1d232a" stroke="#8b96a3" stroke-width="1.5"/>
<circle cx="630" cy="332.5" r="9" fill="#2b8fd6"/>
<text x="630" y="336.4" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">3</text>
<text x="630" y="358.6" fill="#e6e9ec" font-size="13" text-anchor="middle">Render preview</text>
<rect x="775.0" y="310" width="150" height="64" rx="8" fill="#1d232a" stroke="#8b96a3" stroke-width="1.5"/>
<circle cx="850" cy="332.5" r="9" fill="#2b8fd6"/>
<text x="850" y="336.4" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">4</text>
<text x="850" y="358.6" fill="#e6e9ec" font-size="13" text-anchor="middle">Automatic checks</text>
<rect x="995.0" y="310" width="150" height="64" rx="8" fill="#1d232a" stroke="#8b96a3" stroke-width="1.5"/>
<circle cx="1070" cy="332.5" r="9" fill="#2b8fd6"/>
<text x="1070" y="336.4" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">6</text>
<text x="1070" y="358.6" fill="#e6e9ec" font-size="13" text-anchor="middle">Publish</text>
<rect x="1215.0" y="310" width="150" height="64" rx="32.0" fill="#1d232a" stroke="#8b96a3" stroke-width="1.5"/>
<circle cx="1290" cy="332.5" r="9" fill="#2b8fd6"/>
