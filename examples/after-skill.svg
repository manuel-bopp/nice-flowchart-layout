<text x="613.0" y="530.0" fill="#6cb4ee" font-size="12" text-anchor="start">preview</text>
<path d="M1070.0,374.0 L1070.0,552.0" fill="none" stroke="#6cb4ee" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#b)"/>
<text x="1078.0" y="530.0" fill="#6cb4ee" font-size="12" text-anchor="start">release entry</text>
<rect x="115.0" y="114" width="150" height="64" rx="8" fill="#1d232a" stroke="#8b96a3" stroke-width="1.5"/>
