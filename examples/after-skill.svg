<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 910" width="1600" height="910" font-family="Helvetica, Arial, FreeSans, sans-serif">
<defs><marker id="g" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#c3cad2"/></marker><marker id="a" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#e0a43a"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#6cb4ee"/></marker></defs>
<rect x="0" y="0" width="1600" height="910" rx="18" fill="#111418"/>
<text x="40" y="42" fill="#e6e9ec" font-size="22" text-anchor="start" font-weight="bold">Upload → validate → render → review → publish</text>
