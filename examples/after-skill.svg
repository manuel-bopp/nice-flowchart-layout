<circle cx="440" cy="156.0" r="4" fill="#e0a43a"/>
<text x="642.5" y="148.0" fill="#e0a43a" font-size="15.5" text-anchor="middle">changes requested</text>
<text x="448" y="304" fill="#e0a43a" font-size="15.5" text-anchor="start">invalid</text>
<text x="362.5" y="148.0" fill="#e0a43a" font-size="15.5" text-anchor="middle">send back</text>
<path d="M440.0,402 L440.0,590" fill="none" stroke="#6cb4ee" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#b)"/>
