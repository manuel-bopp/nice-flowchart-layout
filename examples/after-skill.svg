<path d="M1285.0,364.0 L1345.0,364.0" fill="none" stroke="#c3cad2" stroke-width="2" marker-end="url(#g)"/>
<path d="M845.0,156.0 L440,156.0" fill="none" stroke="#e0a43a" stroke-width="2"/>
<path d="M440,326 L440,156.0" fill="none" stroke="#e0a43a" stroke-width="2"/>
